name: event model vue

# Typecheck + Vitest + build gate for @jasperfx/event-model-vue (src/event-model-vue), the shared
# Event Modeling renderer. It lives here rather than in a console because BOTH consoles consume it
# — Stoat's design-time canvas and CritterWatch's runtime one — and a renderer owned by one of its
# consumers inherits that consumer's release cadence and licence question.
#
# Its own gate, not a job inside a .NET workflow: this package must stay green on its own terms and
# must never be skipped by a path filter scoped to something else.
#
# The layout is pure and asserted on exact coordinates, because the acceptance criterion for the
# package is that one descriptor renders identically in every viewer — and "identically" is only
# checkable if position is a function of the descriptor alone.
on:
  push:
    branches:
      - '**'
    paths:
      - 'src/event-model-vue/**'
      - '.github/workflows/event-model-vue.yml'
  pull_request:
    paths:
      - 'src/event-model-vue/**'
      - '.github/workflows/event-model-vue.yml'

env:
  CI: true

jobs:
  event-model-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/event-model-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (vue-tsc)
        run: npx vue-tsc -b

      - name: Unit tests (Vitest)
        run: npx vitest run

      - name: Library build
        run: npx vite build
