name: publish event-model-vue

# Publishes @jasperfx/event-model-vue (src/event-model-vue) to npmjs.com — the shared Event
# Modeling renderer every viewer consumes. Manual dispatch only, mirroring the NuGet publish's
# posture: the version is whatever package.json says, so bump it there to cut a release. The
# publish step is guarded — an already-published version fails fast rather than republishing — and
# the full typecheck + test + build gate runs first (the same steps as event-model-vue.yml, which
# must stay green on its own terms).
#
# ⚠️ MOVED REPOSITORIES (2026-09-17). This package was published from `JasperFx/bobcat` until
# 0.12.0. npm's trusted-publisher binding names the org, the REPO and the workflow FILENAME, so
# moving the package here invalidated it — the existing binding still points at bobcat and will
# never match a run from this repository.
#
# AUTH — Trusted Publishing (OIDC). No token, and none is needed:
#   The binding lives on the PACKAGE's settings page
#   (npmjs.com/package/@jasperfx/event-model-vue/access), and this package ALREADY EXISTS — it has
#   been published since 0.2.0. So the publisher can simply be REPOINTED at this repository before
#   the first publish from here:
#     GitHub Actions / org `JasperFx` / repo `jasperfx` / workflow `publish-event-model-vue.yml`
#     (filename only — and it must keep this name; renaming the file breaks the binding).
#     Leave environment empty, and delete the old bobcat binding.
#   Then dispatch this workflow normally. `bootstrap` stays false.
#
# ⚠️ THE OWNER'S CASE IS LOAD-BEARING. npm matches the binding against GitHub's OIDC claims,
# which carry the CANONICAL case:
#
#     repository:       JasperFx/jasperfx
#     repository_owner: JasperFx
#
# A binding saved as `jasperfx/jasperfx` does not match `JasperFx/jasperfx`, and npm reports that
# as:
#
#     POST 404 /-/npm/v1/oidc/token/exchange/package/@jasperfx%2fevent-model-vue
#     OIDC token exchange error - package not found
#
# That message is why this cost an afternoon on 2026-09-18: it does not distinguish "no binding
# configured" from "a binding is configured and did not match", so every diagnosis from the logs
# looked like the former. Correcting the owner to `JasperFx` turned the same request into a 201
# with nothing else changed. Note the asymmetry — the OWNER is mixed case, the REPO really is
# lowercase `jasperfx`.
#
# To test a binding WITHOUT burning a version: on a throwaway branch, add a push trigger, add
# `--dry-run --loglevel verbose` to the publish, and bump the version so the republish guard lets
# npm reach the exchange. A hand-rolled curl is not a substitute — the registry rejected a
# request that carried an Authorization header, so only npm reproduces the exchange faithfully.
#
# ⚠️ `bootstrap: true` is for a package that has NEVER been published, where no settings page
# exists yet to name a publisher on. It is NOT the way to move an existing package between repos,
# and on 2026-09-18 it was tried here and failed:
#
#     npm notice npm tokens that bypass 2FA are being restricted for account changes and
#     direct publishing.  https://gh.io/npm-gat-bypass2fa-deprecation
#     npm error code EOTP — This operation requires a one-time password.
#
# npm is closing the 2FA-bypass behaviour that made automation tokens work unattended, so a
# granular or automation token now prompts for an OTP that CI cannot answer. The token path is a
# dead end for an interactive-2FA account; OIDC is the only unattended route. The run got as far
# as signing and logging a provenance statement before the registry refused the upload — the
# package itself did not publish.
#
# Trusted publishing needs npm CLI >= 11.5.1 (hence the npm upgrade step) and an explicit
# --provenance (the docs claim it is automatic; in practice the flag is still required).
on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'First publish from this repo: authenticate with the NPM_TOKEN secret instead of OIDC'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # the OIDC credential for trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing does not support self-hosted runners
    defaults:
      run:
        working-directory: src/event-model-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Refuse to republish an existing version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already on npmjs.com — bump the version in package.json to cut a release."
            exit 1
          fi
          echo "Publishing $NAME@$VERSION"

      - name: Typecheck (vue-tsc)
        run: npx vue-tsc -b

      - name: Unit tests (Vitest)
        run: npx vitest run

      - name: Library build
        run: npx vite build

      # Exactly one of the two publish steps runs. They are separate steps rather than a
      # conditional env because setup-node's .npmrc reads NODE_AUTH_TOKEN — an empty-but-present
      # token can shadow the OIDC exchange.
      - name: Publish (bootstrap — NPM_TOKEN, first release from this repo only)
        if: ${{ inputs.bootstrap }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish (trusted publishing — OIDC, no token)
        if: ${{ !inputs.bootstrap }}
        # setup-node's registry-url writes an .npmrc whose _authToken reads NODE_AUTH_TOKEN and
        # exports a PLACEHOLDER value (XXXXX-…) into every later step. npm then presents that
        # placeholder as a real token and never attempts the OIDC exchange — the registry answers
        # E404 (proven on run 2026-08-25). Pointing the userconfig at a file that does not exist
        # removes the _authToken line entirely, which is what lets npm >= 11.5.1 fall through to
        # trusted publishing.
        run: |
          printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/.npmrc-oidc-no-token"
          npm publish --access public --provenance
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/.npmrc-oidc-no-token
