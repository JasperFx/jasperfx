name: JasperFx NuGet Manual Publish

on:
  workflow_dispatch:
    inputs:
      allow_republish:
        description: "Push even when JasperFxVersion is already on nuget.org (retry a publish that failed partway, or ship a package whose own version moved, such as JasperFx.RuntimeCompiler). Packages already published are skipped as duplicates."
        type: boolean
        default: false

env:
  config: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  NUKE_TELEMETRY_OPTOUT: true

jobs:
  publish_job:
    runs-on: ubuntu-latest

    # Trusted publishing: the job's OIDC token is exchanged for a short-lived NuGet key
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install .NET 11.0.x (RC)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: jeremydmiller

      - name: Nuget Push
        run: ./build.sh NugetPush ${{ inputs.allow_republish == true && '--allow-republish' || '' }}
        env:
          NugetApiKey: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
