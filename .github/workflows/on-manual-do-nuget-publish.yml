name: JasperFx NuGet Manual Publish

on: [ workflow_dispatch ]

env:
  config: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  NUKE_TELEMETRY_OPTOUT: true

jobs:
  publish_job:
    runs-on: ubuntu-latest

    # Trusted publishing: the job's OIDC token is exchanged for a short-lived NuGet key
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: jeremydmiller

      - name: Nuget Push
        run: ./build.sh NugetPush
        env:
          NugetApiKey: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
